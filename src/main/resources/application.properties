spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devutec}
spring.datasource.username=${DB_USERNAME:devutec}
spring.datasource.password=${DB_PASSWORD:devutec}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@devutec.com}
app.frontend-url=${FRONTEND_URL:https://devutec.vercel.app}
# Traducciones nuevas por persona al día de la IA traductora (las repetidas salen guardadas y no cuentan)
translator.daily-limit=${TRANSLATOR_DAILY_LIMIT:10}
jwt.secret=${JWT_SECRET:devutec-clave-local-solo-para-desarrollo-cambiar-en-produccion}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.require-payment=${STRIPE_REQUIRE_PAYMENT:false}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
google.client-ids=${GOOGLE_CLIENT_IDS:}
# IA (asistente de proyectos, Cuyi, traductora y mini guía): claude (por defecto) o gemini.
# La clave de Claude solo vive en el servidor (ANTHROPIC_API_KEY). Sin clave, Cuyi responde 503 y el front muestra las preguntas frecuentes
ai.provider=${AI_PROVIDER:claude}
claude.api-key=${ANTHROPIC_API_KEY:}
claude.model=${CLAUDE_MODEL:claude-sonnet-5-5}
claude.chat-effort=${CLAUDE_CHAT_EFFORT:low}
claude.fallbacks=${CLAUDE_FALLBACKS:true}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
support.chat.daily-limit=${SUPPORT_CHAT_DAILY_LIMIT:30}

# Asistente de proyectos y precios
assistant.daily-limit=${ASSISTANT_DAILY_LIMIT:40}
app.commission-rate=${COMMISSION_RATE:0.10}
pricing.default-hourly-rate=${PRICING_DEFAULT_HOURLY_RATE:25}
pricing.min-samples=${PRICING_MIN_SAMPLES:3}
pricing.student-hours-per-week=${PRICING_STUDENT_HOURS_PER_WEEK:12}

# Estudiantes: registrarse con correo universitario (.edu.pe). false solo para cargar cuentas de demo con Gmail.
auth.student-email-check=${STUDENT_EMAIL_CHECK:true}
