spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devutec}
spring.datasource.username=${DB_USERNAME:devutec}
spring.datasource.password=${DB_PASSWORD:devutec}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Web de DevUTEC: los botones de los correos llevan aquí y las imágenes se sirven desde <url>/email/
app.frontend-url=${FRONTEND_URL:https://devutec.vercel.app}
jwt.secret=${JWT_SECRET:devutec-clave-local-solo-para-desarrollo-cambiar-en-produccion}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
