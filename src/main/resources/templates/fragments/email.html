<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Encabezado de todos los correos: fondo tinta con el logo DEVUTEC -->
<div th:fragment="header" style="background-color:#0e0e0c; padding:28px 32px;">
    <span style="color:#ffffff; font-family:Arial, sans-serif; font-size:18px; font-weight:bold; letter-spacing:2px;">DEVUTEC</span>
    <span style="display:inline-block; width:8px; height:8px; margin-left:4px; background-color:#d7f25c; border-radius:50%;"></span>
</div>

<!-- Botón verde que lleva a la web -->
<div th:fragment="button(label)" style="margin:28px 0 8px;">
    <a th:href="${webUrl}" th:text="${label}"
       style="display:inline-block; background-color:#1f6f4a; color:#ffffff; text-decoration:none; font-size:14px; font-weight:bold; padding:12px 22px; border-radius:8px;">Ir a DevUTEC</a>
</div>

<!-- Pie de todos los correos -->
<div th:fragment="footer" style="padding:20px 32px; border-top:1px solid #e4e0d8; color:#6f6d67; font-size:12px; line-height:1.5;">
    <p style="margin:0;">Recibiste este correo porque tienes una cuenta en DevUTEC.</p>
    <p style="margin:4px 0 0;">DevUTEC · Lima, Perú · Trabajo junior con reglas de adulto.</p>
</div>

</body>
</html>
