<!doctype html>
<!-- Al cliente cuando un freelancer postula a su proyecto. Variables: clientName, freelancerName, projectTitle, appUrl, actionUrl -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email-layout :: layout(${freelancerName + ' postuló a «' + projectTitle + '»'}, 'Revisa su propuesta y decide si la contratas.', 'cuyi-saluda.png', 'Cuyi, la mascota de DEVUTEC, saludando', ~{::content})}">
<body>
<th:block th:fragment="content">
<th:block th:replace="~{email-layout :: mailTitle('Tienes una nueva', 'postulación.')}"></th:block>
<tr><td><p style="margin:0;font-family:Geist, Helvetica, Arial, sans-serif;font-size:15px;line-height:24px;color:#6f6d67;text-align:center">Hola, <th:block th:text="${clientName}">Pizzería Don Mario</th:block>. <strong th:text="${freelancerName}" style="color:#0e0e0c;font-weight:600">Camila Ríos</strong> quiere trabajar en tu proyecto. Revisa su perfil y su propuesta antes de decidir.</p></td></tr>
<th:block th:replace="~{email-layout :: mailSpace(28)}"></th:block>
<tr><td><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;border:1px solid #e4e0d8;border-radius:14px">
<tr th:replace="~{email-layout :: mailDetail('Proyecto', ${projectTitle}, true)}"></tr>
<tr th:replace="~{email-layout :: mailDetail('Postulante', ${freelancerName}, false)}"></tr>
<tr><td style="border-top:1px solid #e4e0d8;padding:14px 18px;font-family:Geist, Helvetica, Arial, sans-serif;font-size:11px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;color:#6f6d67;text-align:left">Estado</td><td style="border-top:1px solid #e4e0d8;padding:14px 18px;font-family:Geist, Helvetica, Arial, sans-serif;font-size:14px;line-height:20px;font-weight:600;color:#b7791f;text-align:right">Por revisar</td></tr>
</table></td></tr>
<th:block th:replace="~{email-layout :: mailButton('Ver postulantes')}"></th:block>
</th:block>
</body>
</html>
