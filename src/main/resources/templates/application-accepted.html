<!doctype html>
<!-- Al freelancer cuando el cliente acepta su postulación. Variables: freelancerName, projectTitle, appUrl, actionUrl -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email-layout :: layout(${'Te contrataron para «' + projectTitle + '»'}, 'El pago ya está retenido en garantía. Puedes empezar.', 'cuyi-celebra.png', 'Cuyi, la mascota de DevUTEC, celebrando', ~{::content})}">
<body>
<th:block th:fragment="content">
<th:block th:replace="~{email-layout :: mailTitle('Tu postulación fue', 'aceptada.')}"></th:block>
<tr><td><p style="margin:0;font-family:Geist, Helvetica, Arial, sans-serif;font-size:15px;line-height:24px;color:#6f6d67;text-align:center">¡Felicidades, <th:block th:text="${freelancerName}">Camila Ríos</th:block>! El cliente aceptó tu propuesta para <strong th:text="${projectTitle}" style="color:#0e0e0c;font-weight:600">Web para pizzería</strong>. Ya puedes empezar a trabajar.</p></td></tr>
<th:block th:replace="~{email-layout :: mailSpace(28)}"></th:block>
<tr><td><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;border:1px solid #e4e0d8;border-radius:14px">
<tr th:replace="~{email-layout :: mailDetail('Proyecto', ${projectTitle}, true)}"></tr>
<tr><td style="border-top:1px solid #e4e0d8;padding:14px 18px;font-family:Geist, Helvetica, Arial, sans-serif;font-size:11px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;color:#6f6d67;text-align:left">Estado</td><td style="border-top:1px solid #e4e0d8;padding:14px 18px;font-family:Geist, Helvetica, Arial, sans-serif;font-size:14px;line-height:20px;font-weight:600;color:#1f6f4a;text-align:right">Contratada</td></tr>
</table>
<th:block th:replace="~{email-layout :: mailEscrowPill('Tu pago está protegido en garantía.', 'El cliente ya pagó.')}"></th:block>
</td></tr>
<th:block th:replace="~{email-layout :: mailButton('Ver mis contratos')}"></th:block>
</th:block>
</body>
</html>
