<!doctype html>
<!-- Al cliente cuando el freelancer marca el trabajo como entregado. Variables: clientName, freelancerName, projectTitle, appUrl, actionUrl, deliveryUrl, deliveryNote (vacía si no hay) -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email-layout :: layout(${freelancerName + ' entregó «' + projectTitle + '»'}, 'Revisa el trabajo y confirma la entrega para liberar el pago.', 'cuyi-escribe.png', 'Cuyi, la mascota de DEVUTEC, trabajando en su laptop', ~{::content})}">
<body>
<th:block th:fragment="content">
<th:block th:replace="~{email-layout :: mailTitle('Tu proyecto fue', 'entregado.')}"></th:block>
<tr><td><p style="margin:0;font-family:Geist, Helvetica, Arial, sans-serif;font-size:15px;line-height:24px;color:#6f6d67;text-align:center">Hola, <th:block th:text="${clientName}">Pizzería Don Mario</th:block>. <strong th:text="${freelancerName}" style="color:#0e0e0c;font-weight:600">Camila Ríos</strong> entregó <strong th:text="${projectTitle}" style="color:#0e0e0c;font-weight:600">Web para pizzería</strong>. Revisa el trabajo y confirma la entrega cuando estés conforme.</p></td></tr>
<th:block th:replace="~{email-layout :: mailSpace(28)}"></th:block>
<tr><td><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;border:1px solid #e4e0d8;border-radius:14px">
<tr th:replace="~{email-layout :: mailDetail('Proyecto', ${projectTitle}, true)}"></tr>
<tr th:replace="~{email-layout :: mailDetail('Entregado por', ${freelancerName}, false)}"></tr>
<tr th:if="${deliveryUrl}"><td style="border-top:1px solid #e4e0d8;padding:14px 18px;font-family:Geist, Helvetica, Arial, sans-serif;font-size:11px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;color:#6f6d67;text-align:left">Trabajo</td><td style="border-top:1px solid #e4e0d8;padding:14px 18px;font-family:Geist, Helvetica, Arial, sans-serif;font-size:14px;line-height:20px;font-weight:600;text-align:right"><a th:href="${deliveryUrl}" href="#" style="color:#1f6f4a;text-decoration:underline">Abrir el link ↗</a></td></tr>
</table>
<th:block th:if="${deliveryNote != null and !#strings.isEmpty(deliveryNote)}">
<div style="height:16px;line-height:16px;font-size:0">&nbsp;</div>
<p style="margin:0;padding:14px 18px;background:#f5f3ee;border-radius:12px;font-family:Geist, Helvetica, Arial, sans-serif;font-size:14px;line-height:22px;color:#0e0e0c;text-align:left"><span style="display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6f6d67;margin-bottom:4px">Nota de <th:block th:text="${freelancerName}">Camila Ríos</th:block></span><th:block th:text="${deliveryNote}">Te dejo el diseño en Figma y los archivos exportados en la carpeta.</th:block></p>
</th:block>
<th:block th:replace="~{email-layout :: mailSteps(1)}"></th:block>
<div style="height:4px;line-height:4px;font-size:0">&nbsp;</div>
<th:block th:replace="~{email-layout :: mailEscrowPill('Tu pago está protegido en garantía.', 'Se libera solo cuando confirmes la entrega.')}"></th:block>
</td></tr>
<th:block th:replace="~{email-layout :: mailButton('Revisar la entrega')}"></th:block>
</th:block>
</body>
</html>
