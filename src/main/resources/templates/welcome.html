<!doctype html>
<!-- A quien acaba de crear su cuenta (con contraseña o con Google). Variables: name, isFreelancer, appUrl, actionUrl -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email-layout :: layout(${'Bienvenido a DevUTEC, ' + name}, ${isFreelancer ? 'Completa tu perfil y postula a tu primer proyecto.' : 'Publica tu proyecto y elige a tu freelancer.'}, 'cuyi-saluda.png', 'Cuyi, la mascota de DevUTEC, saludando', ~{::content})}">
<body>
<th:block th:fragment="content">
    <th:block th:replace="~{email-layout :: mailTitle('Te damos la', 'bienvenida.')}"></th:block>
    <tr><td><p style="margin:0;font-family:Geist, Helvetica, Arial, sans-serif;font-size:15px;line-height:24px;color:#6f6d67;text-align:center">Hola, <strong th:text="${name}" style="color:#0e0e0c;font-weight:600">Camila Ríos</strong>. Tu cuenta en DevUTEC ya está lista.</p></td></tr>
    <th:block th:replace="~{email-layout :: mailSpace(28)}"></th:block>
    <tr><td><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;border:1px solid #e4e0d8;border-radius:14px">
        <th:block th:if="${isFreelancer}">
            <tr th:replace="~{email-layout :: mailDetail('Paso 1', 'Completa tu perfil', true)}"></tr>
            <tr th:replace="~{email-layout :: mailDetail('Paso 2', 'Postula a un proyecto', false)}"></tr>
            <tr th:replace="~{email-layout :: mailDetail('Paso 3', 'Entrega y cobra seguro', false)}"></tr>
        </th:block>
        <th:block th:unless="${isFreelancer}">
            <tr th:replace="~{email-layout :: mailDetail('Paso 1', 'Publica tu proyecto', true)}"></tr>
            <tr th:replace="~{email-layout :: mailDetail('Paso 2', 'Elige a tu freelancer', false)}"></tr>
            <tr th:replace="~{email-layout :: mailDetail('Paso 3', 'Libera el pago al aprobar la entrega', false)}"></tr>
        </th:block>
    </table>
        <th:block th:replace="~{email-layout :: mailEscrowPill('Pago en garantía.', 'Ningún pago se mueve sin una confirmación.')}"></th:block>
    </td></tr>
    <th:block th:replace="~{email-layout :: mailButton(${isFreelancer ? 'Completar mi perfil' : 'Publicar un proyecto'})}"></th:block>
</th:block>
</body>
</html>
