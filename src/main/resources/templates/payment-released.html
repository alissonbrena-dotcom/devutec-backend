<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="margin:0; padding:0; background-color:#f5f3ee; font-family:Arial, sans-serif;">
<div style="max-width:600px; margin:32px auto; background-color:#ffffff; border:1px solid #e4e0d8; border-radius:12px; overflow:hidden;">
    <div th:replace="~{fragments/email :: header}"></div>

    <div style="padding:32px; color:#0e0e0c; line-height:1.6; font-size:15px;">
        <p style="margin:0; color:#1f6f4a; font-size:11px; font-weight:bold; letter-spacing:1.5px;">PAGO LIBERADO</p>
        <h1 style="margin:8px 0 20px; font-family:Georgia, serif; font-style:italic; font-weight:normal; font-size:28px;">Tu pago ya es tuyo.</h1>

        <p>Hola <strong th:text="${freelancerName}">freelancer</strong>,</p>
        <p>El cliente confirmó la entrega de <strong th:text="${projectTitle}">tu proyecto</strong> y DevUTEC liberó el pago que estaba en garantía.</p>

        <div style="background-color:#eaf3ed; border-radius:10px; padding:20px; margin:24px 0;">
            <p style="margin:0; color:#1f6f4a; font-size:12px; font-weight:bold; letter-spacing:1px;">MONTO LIBERADO</p>
            <p style="margin:6px 0 0; font-size:30px; font-weight:bold;">S/ <span th:text="${#numbers.formatDecimal(amount, 1, 'COMMA', 2, 'POINT')}">0.00</span></p>
            <p style="margin:6px 0 0; color:#6f6d67; font-size:13px;">Pago #<span th:text="${paymentId}">0</span></p>
        </div>

        <p>¡Gracias por tu trabajo! Ahora puedes dejarle una reseña al cliente.</p>
        <div th:replace="~{fragments/email :: button('Ver mis contratos')}"></div>
    </div>

    <div th:replace="~{fragments/email :: footer}"></div>
</div>
</body>
</html>
