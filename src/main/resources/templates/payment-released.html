<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="margin:0; padding:0; background-color:#f4f4f7; font-family:Arial, sans-serif;">
<div style="max-width:600px; margin:40px auto; background:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08);">

    <div style="background-color:#2563eb; padding:32px; text-align:center;">
        <h1 style="color:#ffffff; margin:0; font-size:24px;">💸 ¡Tu pago ha sido liberado!</h1>
    </div>

    <div style="padding:32px; color:#333333; line-height:1.6;">
        <p style="font-size:16px;">Hola,</p>
        <p style="font-size:16px;">
            Te confirmamos que el pago por tu trabajo ya fue liberado a tu cuenta.
        </p>

        <div style="background-color:#f0f5ff; border-radius:8px; padding:20px; margin:24px 0; text-align:center;">
            <p style="margin:0; color:#666; font-size:14px;">Monto liberado</p>
            <p style="margin:8px 0 0; color:#2563eb; font-size:32px; font-weight:bold;">
                S/ <span th:text="${amount}">0.00</span>
            </p>
            <p style="margin:12px 0 0; color:#999; font-size:13px;">
                Pago #<span th:text="${paymentId}">0</span>
            </p>
        </div>

        <p style="font-size:16px;">¡Gracias por tu trabajo en DevUTEC! 🚀</p>
    </div>

    <div style="background-color:#f4f4f7; padding:20px; text-align:center; color:#999; font-size:12px;">
        <p style="margin:0;">Este es un correo automático de DevUTEC, no responder.</p>
    </div>
</div>
</body>
</html>
