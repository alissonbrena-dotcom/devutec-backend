<!doctype html>
<!-- Al freelancer cuando el cliente confirma la entrega y se libera el pago.
     Variables: freelancerName, projectTitle, amount (BigDecimal), paymentId, appUrl, actionUrl -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email-layout :: layout(${'Tu pago de S/ ' + #numbers.formatDecimal(amount, 1, 'COMMA', 2, 'POINT') + ' fue liberado'}, ${'El cliente confirmó la entrega de «' + projectTitle + '».'}, 'cuyi-celebra.png', 'Cuyi, la mascota de DevUTEC, celebrando', ~{::content})}">
<body>
<th:block th:fragment="content">
<th:block th:replace="~{email-layout :: mailTitle('Tu pago fue', 'liberado.')}"></th:block>
<tr><td><p style="margin:0;font-family:Geist, Helvetica, Arial, sans-serif;font-size:15px;line-height:24px;color:#6f6d67;text-align:center">Hola, <th:block th:text="${freelancerName}">Camila Ríos</th:block>. El cliente confirmó la entrega de <strong th:text="${projectTitle}" style="color:#0e0e0c;font-weight:600">Web para pizzería</strong> y liberamos tu pago desde la garantía.</p></td></tr>
<th:block th:replace="~{email-layout :: mailSpace(28)}"></th:block>
<tr><td th:with="money=${#numbers.formatDecimal(amount, 1, 'COMMA', 2, 'POINT')}">
<!-- Monto grande: "S/ 600" en tinta y ".00" en gris -->
<p style="margin:0;font-family:Geist, Helvetica, Arial, sans-serif;font-size:56px;line-height:60px;font-weight:600;letter-spacing:-.05em;color:#0e0e0c;text-align:center">S/&nbsp;<th:block th:text="${#strings.substringBefore(money, '.')}">600</th:block><span th:text="${'.' + #strings.substringAfter(money, '.')}" style="color:#9e9b94">.00</span></p>
<p style="margin:6px 0 0;font-family:Geist, Helvetica, Arial, sans-serif;font-size:13px;line-height:18px;color:#6f6d67;text-align:center">liberados a <th:block th:text="${freelancerName}">Camila Ríos</th:block></p>
<div style="height:24px;line-height:24px;font-size:0">&nbsp;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;border:1px solid #e4e0d8;border-radius:14px">
<tr th:replace="~{email-layout :: mailDetail('Proyecto', ${projectTitle}, true)}"></tr>
<tr th:replace="~{email-layout :: mailDetail('Pago', ${'#PG-' + #numbers.formatInteger(paymentId, 4)}, false)}"></tr>
</table>
<th:block th:replace="~{email-layout :: mailSteps(3)}"></th:block>
<div style="height:4px;line-height:4px;font-size:0">&nbsp;</div>
<th:block th:replace="~{email-layout :: mailEscrowPill('Pago liberado desde la garantía.', 'El cliente confirmó la entrega.')}"></th:block>
</td></tr>
<th:block th:replace="~{email-layout :: mailButton('Ver el contrato')}"></th:block>
</th:block>
</body>
</html>
