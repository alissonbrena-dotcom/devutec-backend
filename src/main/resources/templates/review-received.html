<!doctype html>
<!-- A quien recibe una reseña. Variables: revieweeName, authorName, projectTitle, rating (1 a 5), comment (puede venir vacío),
     appUrl, actionUrl, actionLabel -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email-layout :: layout(${authorName + ' te dejó una reseña'}, ${'Mira lo que opinaron de ti en «' + projectTitle + '».'}, 'cuyi-saluda.png', 'Cuyi, la mascota de DevUTEC, saludando', ~{::content})}">
<body>
<th:block th:fragment="content">
<th:block th:replace="~{email-layout :: mailTitle('Recibiste una nueva', 'reseña.')}"></th:block>
<tr><td><p style="margin:0;font-family:Geist, Helvetica, Arial, sans-serif;font-size:15px;line-height:24px;color:#6f6d67;text-align:center">Hola, <th:block th:text="${revieweeName}">Camila Ríos</th:block>. <strong th:text="${authorName}" style="color:#0e0e0c;font-weight:600">Pizzería Don Mario</strong> te calificó por <strong th:text="${projectTitle}" style="color:#0e0e0c;font-weight:600">Web para pizzería</strong>.</p></td></tr>
<th:block th:replace="~{email-layout :: mailSpace(28)}"></th:block>
<tr><td><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;border:1px solid #e4e0d8;border-radius:14px"><tr><td style="padding:24px 22px;text-align:center">
<!-- Estrellas llenas en ámbar y vacías en gris -->
<p style="margin:0;font-family:Arial, Helvetica, sans-serif;font-size:28px;line-height:32px;letter-spacing:4px"><span th:each="star : ${#numbers.sequence(1, 5)}" th:style="${star <= rating} ? 'color:#b7791f' : 'color:#d9d5cc'" style="color:#b7791f">&#9733;</span></p>
<p style="margin:6px 0 0;font-family:Geist, Helvetica, Arial, sans-serif;font-size:13px;line-height:18px;color:#6f6d67;text-align:center"><strong th:text="${rating}" style="color:#0e0e0c;font-weight:600">5</strong> de 5</p>
<th:block th:if="${!#strings.isEmpty(comment)}">
<p th:text="${'«' + #strings.trim(comment) + '»'}" style="margin:20px 0 0;font-family:'Instrument Serif', Georgia, serif;font-style:italic;font-size:22px;line-height:30px;color:#0e0e0c;text-align:center">«Comentario»</p>
<p th:text="${authorName + ' · ' + projectTitle}" style="margin:14px 0 0;font-family:Geist, Helvetica, Arial, sans-serif;font-size:12px;line-height:18px;color:#6f6d67;text-align:center">Autor · Proyecto</p>
</th:block>
</td></tr></table></td></tr>
<th:block th:replace="~{email-layout :: mailButton(${actionLabel})}"></th:block>
</th:block>
</body>
</html>
