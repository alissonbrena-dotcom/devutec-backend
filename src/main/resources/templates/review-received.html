<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="margin:0; padding:0; background-color:#f4f4f7; font-family:Arial, sans-serif;">
<div style="max-width:600px; margin:40px auto; background:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08);">

    <div style="background-color:#f59e0b; padding:32px; text-align:center;">
        <h1 style="color:#ffffff; margin:0; font-size:24px;">⭐ ¡Recibiste una nueva reseña!</h1>
    </div>

    <div style="padding:32px; color:#333333; line-height:1.6;">
        <p style="font-size:16px;">Hola <span th:text="${revieweeName}">usuario</span>,</p>
        <p style="font-size:16px;">
            <strong th:text="${authorName}">Alguien</strong> dejó una reseña sobre el proyecto
            <strong th:text="${projectTitle}">proyecto</strong>.
        </p>

        <div style="background-color:#fffbeb; border-radius:8px; padding:20px; margin:24px 0; text-align:center;">
            <p style="margin:0; color:#666; font-size:14px;">Calificación</p>
            <p style="margin:8px 0 0; color:#f59e0b; font-size:32px; letter-spacing:4px;"
               th:text="${#strings.repeat('★', rating) + #strings.repeat('☆', 5 - rating)}">★★★★★</p>
        </div>

        <p style="font-size:16px;">Ingresa a DevUTEC para leer el comentario completo.</p>
    </div>

    <div style="background-color:#f4f4f7; padding:20px; text-align:center; color:#999; font-size:12px;">
        <p style="margin:0;">Este es un correo automático de DevUTEC, no responder.</p>
    </div>
</div>
</body>
</html>
