<!doctype html>
<!-- Al cliente: el contrato se cerró porque no hizo el pago 2 a tiempo.
     Variables: clientName, freelancerName, projectTitle, refunded (texto "S/ 0.00"), appUrl, actionUrl -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email-layout :: layout(${'Se cerró el contrato de «' + projectTitle + '»'}, 'No se hizo el pago 2 a tiempo.', 'cuyi-escribe.png', 'Cuyi, la mascota de DEVUTEC', ~{::content})}">
<body>
<th:block th:fragment="content">
<th:block th:replace="~{email-layout :: mailTitle('Se cerró', 'tu contrato.')}"></th:block>
<tr><td><p style="margin:0;font-family:Geist, Helvetica, Arial, sans-serif;font-size:15px;line-height:24px;color:#6f6d67;text-align:center">Hola, <th:block th:text="${clientName}">Mario</th:block>. Venció el plazo del pago 2 de <strong th:text="${projectTitle}" style="color:#0e0e0c;font-weight:600">Web para pizzería</strong> y el contrato se cerró. Las etapas que aprobaste se quedan con <th:block th:text="${freelancerName}">Sofía</th:block>, que también recibe la bolsa de emergencia por el trabajo hecho. Las etapas que faltaban se cancelaron.</p></td></tr>
<th:block th:replace="~{email-layout :: mailSpace(24)}"></th:block>
<tr><td><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;border:1px solid #e4e0d8;border-radius:14px">
<tr th:replace="~{email-layout :: mailDetail('Proyecto', ${projectTitle}, true)}"></tr>
<tr th:replace="~{email-layout :: mailDetail('Se te devuelve', ${refunded}, false)}"></tr>
</table></td></tr>
<th:block th:replace="~{email-layout :: mailButton('Ver el contrato')}"></th:block>
</th:block>
</body>
</html>
